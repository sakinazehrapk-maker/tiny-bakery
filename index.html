<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run a Tiny Bakery </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="bakery-header">
            <h1>Tiny Bakery</h1>
            <p>Make cakes. Make customers happy.</p>
        </header>
        <section class="game-info">
            <div class="info-card">
                <span>💰</span>
                <strong id="money">0</strong>
                <small>Coins</small>
            </div>
            <div class="info-card">
                <span>⭐</span>
                <strong id="score">0</strong>
                <small>Score</small>
            </div>
            <div class="info-card">
                <span>👩‍🍳</span>
                <strong id="orders">0</strong>
                <small>Orders</small>
            </div>
        </section>
        <section class="customer-area">
            <div class="customer">
                <div class="customer-avatar">
                    👩
                </div>
                <div class="customer-speech">
                    <h2>Welcome to my bakery!</h2>
                    <p id="order-text">
                        Waiting for an order...
                    </p>
                    <div class="patience-area">
                        <div class="patience-label">
                            <span>Patience</span>
                            <span id="patience-time">20s</span>
                        </div>
                        <div class="patience-bar">
                            <div id="patience-progress"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="bakery-counter">
            <div class="station">
                <h2>🎂 Cake</h2>
                <div id="cake-display" class="cake-display">
    <div class="cake">
        <div class="cake-decoration">
            ✨
        </div>
        <div class="cake-top">
        </div>
        <div class="cake-middle">
        </div>
        <div class="cake-bottom">
        </div>
    </div>
</div>
            </div>
            <div class="station">
    <h2>Bakery</h2>
    <button id="bake-button">
        Bake Cake
    </button>
    <div class="progress-container">
        <div id="baking-progress"></div>
    </div>
    <p id="baking-status">
        Oven is ready!
    </p>
</div>
            <button class="decoration" data-decoration="Strawberries">
                🍓
            </button>
            <button class="decoration" data-decoration="Flowers">
                🌸
            </button>
            <button class="decoration" data-decoration="Sprinkles">
                ✨
            </button>
            <button class="decoration" data-decoration="Chocolate">
                🍫
            </button>
            </div>
        </section>
        <section class="serve-area">
            <button id="serve-button">
            Serve Customer
            </button>
        </section>
        <section class="message-area">
            <p id="game-message">
                Welcome, baker!
            </p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
